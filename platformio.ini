; Omni Chair firmware for the LilyGO T-Display S3

[env:lilygo-t-display-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

monitor_speed = 115200
; Change COM7 if the board shows up on another port
upload_port = COM7
monitor_port = COM7

lib_deps =
    bodmer/TFT_eSPI

build_flags =
    ; Serial runs over the USB-C port
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

    ; Screen setup for the built-in 320x170 display
    -D USER_SETUP_LOADED
    -D ST7789_DRIVER
    -D INIT_SEQUENCE_3
    -D CGRAM_OFFSET
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON
    -D TFT_PARALLEL_8_BIT
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_CS=6
    -D TFT_DC=7
    -D TFT_RST=5
    -D TFT_WR=8
    -D TFT_RD=9
    -D TFT_D0=39
    -D TFT_D1=40
    -D TFT_D2=41
    -D TFT_D3=42
    -D TFT_D4=45
    -D TFT_D5=46
    -D TFT_D6=47
    -D TFT_D7=48
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=HIGH

    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT